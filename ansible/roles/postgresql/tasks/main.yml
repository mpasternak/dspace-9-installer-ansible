---
- name: Install PostgreSQL dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - postgresql-common
      - apt-transport-https
      - lsb-release
      - wget
    state: present
    update_cache: true

- name: Add PostgreSQL APT repository key
  ansible.builtin.apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Add PostgreSQL APT repository
  ansible.builtin.apt_repository:
    repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_lsb.codename }}-pgdg main"
    state: present
    update_cache: true

- name: Install PostgreSQL {{ postgres_version }}
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-client-{{ postgres_version }}"
      - "postgresql-contrib-{{ postgres_version }}"
      - python3-psycopg2
    state: present

- name: Ensure PostgreSQL is running
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true

- name: Create DSpace database user
  community.postgresql.postgresql_user:
    name: "{{ postgres_user }}"
    password: "{{ postgres_password }}"
    state: present
    login_unix_socket: /var/run/postgresql
  become: true
  become_user: postgres
  become_method: ansible.builtin.sudo

- name: Create DSpace database
  community.postgresql.postgresql_db:
    name: "{{ postgres_db }}"
    owner: "{{ postgres_user }}"
    encoding: UTF8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    template: template0
    state: present
    login_unix_socket: /var/run/postgresql
  become: true
  become_user: postgres
  become_method: ansible.builtin.sudo

- name: Grant all privileges to DSpace user on DSpace database
  community.postgresql.postgresql_privs:
    db: "{{ postgres_db }}"
    privs: ALL
    type: database
    role: "{{ postgres_user }}"
    state: present
    login_unix_socket: /var/run/postgresql
  become: true
  become_user: postgres
  become_method: ansible.builtin.sudo

- name: Configure PostgreSQL to accept connections
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    regexp: "^#?listen_addresses"
    line: "listen_addresses = 'localhost'"
    state: present
  notify: restart postgresql

- name: Configure PostgreSQL authentication
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
  notify: restart postgresql

- name: Install pgcrypto extension
  community.postgresql.postgresql_ext:
    name: pgcrypto
    db: "{{ postgres_db }}"
    state: present
  become: true
  become_user: postgres

- name: Create restart postgresql handler
  ansible.builtin.debug:
    msg: "PostgreSQL configuration completed"

- name: Ensure PostgreSQL is restarted
  ansible.builtin.meta: flush_handlers
