---
# Main task file for DSpace frontend role
# This includes all sub-tasks in sequence

- name: Create frontend user
  ansible.builtin.include_tasks: user.yml
- name: Install prerequisites (Node.js, PM2, build tools)
  ansible.builtin.include_tasks: prerequisites.yml
- name: Download and extract DSpace Angular source
  ansible.builtin.include_tasks: download.yml
- name: Configure DSpace Angular frontend
  ansible.builtin.include_tasks: config.yml
- name: Build and deploy DSpace Angular frontend
  ansible.builtin.include_tasks: build.yml
