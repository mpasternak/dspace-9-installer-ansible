---
- name: Create Tomcat group
  ansible.builtin.group:
    name: "{{ tomcat_group }}"
    system: true
    state: present

- name: Create Tomcat user
  ansible.builtin.user:
    name: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    home: "{{ tomcat_home }}"
    shell: /bin/false
    system: true
    state: present

- name: Create Tomcat directory
  ansible.builtin.file:
    path: "{{ tomcat_home }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0755"

- name: Download Tomcat (fast CDN, fall back to archive.apache.org)
  # CDN first for speed, archive fallback so a pinned (possibly superseded)
  # tomcat_version never 404s. See apache_*_base in group_vars/all.yml.
  block:
    - name: Download Tomcat from CDN (dlcdn.apache.org)
      ansible.builtin.get_url:
        url: "{{ apache_cdn_base }}/tomcat/tomcat-10/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"
        dest: "/tmp/apache-tomcat-{{ tomcat_version }}.tar.gz"
        mode: "0644"
        timeout: 30
  rescue:
    - name: Download Tomcat from archive.apache.org (fallback)
      ansible.builtin.get_url:
        url: "{{ apache_archive_base }}/tomcat/tomcat-10/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"
        dest: "/tmp/apache-tomcat-{{ tomcat_version }}.tar.gz"
        mode: "0644"

- name: Extract Tomcat
  ansible.builtin.unarchive:
    src: "/tmp/apache-tomcat-{{ tomcat_version }}.tar.gz"
    dest: "{{ tomcat_home }}"
    remote_src: true
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    extra_opts: [--strip-components=1]
    creates: "{{ tomcat_home }}/bin/catalina.sh"

- name: Set ownership of Tomcat files
  ansible.builtin.file:
    path: "{{ tomcat_home }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    recurse: true

- name: Make scripts executable
  ansible.builtin.file:
    path: "{{ tomcat_home }}/bin/{{ item }}"
    mode: "0755"
  with_items:
    - catalina.sh
    - ciphers.sh
    - configtest.sh
    - daemon.sh
    - digest.sh
    - setclasspath.sh
    - shutdown.sh
    - startup.sh
    - tool-wrapper.sh
    - version.sh

- name: Create setenv.sh for Tomcat environment variables
  ansible.builtin.template:
    src: setenv.sh.j2
    dest: "{{ tomcat_home }}/bin/setenv.sh"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0755"

- name: Configure Tomcat server.xml
  ansible.builtin.template:
    src: server.xml.j2
    dest: "{{ tomcat_home }}/conf/server.xml"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0600"
    backup: true
  notify: restart tomcat

- name: Configure Tomcat context.xml
  ansible.builtin.template:
    src: context.xml.j2
    dest: "{{ tomcat_home }}/conf/context.xml"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0600"
    backup: true
  notify: restart tomcat

- name: Create Tomcat systemd service file
  ansible.builtin.template:
    src: tomcat.service.j2
    dest: /etc/systemd/system/tomcat.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Remove default webapps
  ansible.builtin.file:
    path: "{{ tomcat_home }}/webapps/{{ item }}"
    state: absent
  with_items:
    - ROOT
    - docs
    - examples
    - host-manager
    - manager

- name: Create webapps directory if it doesn't exist
  ansible.builtin.file:
    path: "{{ tomcat_home }}/webapps"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0755"

- name: Start and enable Tomcat service
  ansible.builtin.systemd:
    name: tomcat
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for Tomcat to be ready
  ansible.builtin.wait_for:
    port: "{{ tomcat_port }}"
    delay: 10
    timeout: 60

- name: Ensure handlers are flushed
  ansible.builtin.meta: flush_handlers
