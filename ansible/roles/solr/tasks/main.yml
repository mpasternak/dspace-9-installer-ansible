---
- name: Create Solr group
  ansible.builtin.group:
    name: "{{ solr_group }}"
    system: true
    state: present

- name: Create Solr user
  ansible.builtin.user:
    name: "{{ solr_user }}"
    group: "{{ solr_group }}"
    home: "/var/solr"
    shell: /bin/bash
    system: true
    state: present

- name: Download Solr (fast CDN, fall back to archive.apache.org)
  # dlcdn.apache.org is a fast CDN but only serves current releases; if a pinned
  # solr_version has been superseded it 404s, so we fall back to the archive,
  # which permanently hosts every release. See apache_*_base in group_vars/all.yml.
  block:
    - name: Download Solr from CDN (dlcdn.apache.org)
      ansible.builtin.get_url:
        url: "{{ apache_cdn_base }}/solr/solr/{{ solr_version }}/solr-{{ solr_version }}.tgz"
        dest: "/tmp/solr-{{ solr_version }}.tgz"
        mode: "0644"
        timeout: 30
  rescue:
    - name: Download Solr from archive.apache.org (fallback)
      ansible.builtin.get_url:
        url: "{{ apache_archive_base }}/solr/solr/{{ solr_version }}/solr-{{ solr_version }}.tgz"
        dest: "/tmp/solr-{{ solr_version }}.tgz"
        mode: "0644"

- name: Extract Solr
  ansible.builtin.unarchive:
    src: "/tmp/solr-{{ solr_version }}.tgz"
    dest: "/opt"
    remote_src: true
    owner: "{{ solr_user }}"
    group: "{{ solr_group }}"
    creates: "/opt/solr-{{ solr_version }}"

- name: Create Solr symlink
  ansible.builtin.file:
    src: "/opt/solr-{{ solr_version }}"
    dest: "{{ solr_home }}"
    state: link
    owner: "{{ solr_user }}"
    group: "{{ solr_group }}"

- name: Create Solr directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ solr_user }}"
    group: "{{ solr_group }}"
    mode: "0755"
  with_items:
    - /var/solr
    - /var/solr/data
    - /var/solr/logs

- name: Copy Solr init script
  ansible.builtin.copy:
    src: "{{ solr_home }}/bin/init.d/solr"
    dest: /etc/init.d/solr
    remote_src: true
    mode: "0755"

- name: Create Solr environment file
  ansible.builtin.template:
    src: solr.in.sh.j2
    dest: /etc/default/solr.in.sh
    owner: root
    group: root
    mode: "0644"
  notify: restart solr

- name: Create Solr systemd service file
  ansible.builtin.template:
    src: solr.service.j2
    dest: /etc/systemd/system/solr.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Configure system-wide limits for Solr user
  ansible.builtin.copy:
    content: |
      # Limits for Solr user
      solr soft nofile 65000
      solr hard nofile 65000
      solr soft nproc 65000
      solr hard nproc 65000
    dest: /etc/security/limits.d/solr.conf
    owner: root
    group: root
    mode: "0644"

- name: Ensure PAM limits module is enabled
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-session
    regexp: "^session.*required.*pam_limits.so"
    line: "session required pam_limits.so"
    state: present

- name: Ensure PAM limits module is enabled (non-interactive)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-session-noninteractive
    regexp: "^session.*required.*pam_limits.so"
    line: "session required pam_limits.so"
    state: present

- name: Set ulimits in solr user profile
  ansible.builtin.blockinfile:
    path: /var/solr/.bashrc
    create: true
    owner: "{{ solr_user }}"
    group: "{{ solr_group }}"
    mode: "0644"
    block: |
      # Set ulimits for Solr
      ulimit -n 65000
      ulimit -u 65000

- name: Start and enable Solr service
  ansible.builtin.systemd:
    name: solr
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for Solr to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ solr_port }}/solr/#/admin/ping"
    method: GET
    status_code: 200
  register: solr_ping
  until: solr_ping.status == 200
  retries: 30
  delay: 5

- name: Create restart solr handler
  ansible.builtin.debug:
    msg: "Solr configuration completed"

- name: Ensure handlers are flushed
  ansible.builtin.meta: flush_handlers
