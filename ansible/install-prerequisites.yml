---
- name: Install DSpace Prerequisites
  hosts: dspace_servers
  become: true

  pre_tasks:
    # Load version-coupled overrides (Java 21 for DSpace 10, Java 17 for 9.x).
    # include_vars outranks group_vars/all.yml. See ansible/vars/profiles/.
    - name: Load DSpace version profile (DSpace {{ dspace_version }})
      ansible.builtin.include_vars: "vars/profiles/{{ dspace_version.split('.')[0] }}.yml"

    - name: Check if running in Docker container
      ansible.builtin.stat:
        path: /.dockerenv
      register: dockerenv_check

    - name: Check for Docker in cgroup (alternative detection)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          cat /proc/1/cgroup | grep -q docker
        executable: /bin/bash
      register: cgroup_docker_check
      failed_when: false
      changed_when: false

    - name: Set Docker detection fact
      ansible.builtin.set_fact:
        is_docker: "{{ dockerenv_check.stat.exists or cgroup_docker_check.rc == 0 }}"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install basic packages
      ansible.builtin.apt:
        name:
          - software-properties-common
          - ca-certificates
          - curl
          - wget
          - gnupg
          - lsb-release
          - net-tools
          - unzip
          - bzip2
          - xz-utils
        state: present

    - name: Install optional interactive packages (skip in CI/Docker)
      ansible.builtin.apt:
        name:
          - vim
          - htop
          - emacs-nox
          - links
        state: present
      when: lookup('env', 'CI') != 'true'
      # Optional convenience packages; a failure here must not abort the install.
      failed_when: false

    - name: Set timezone
      community.general.timezone:
        name: "{{ timezone }}"

    - name: Generate locale
      community.general.locale_gen:
        name: "{{ locale }}"
        state: present

    - name: Set default locale
      ansible.builtin.command: update-locale LANG={{ locale }}
      changed_when: false

  tasks:
    - name: Setup swap (skip in Docker)
      ansible.builtin.include_role:
        name: swap
      when: not is_docker

  roles:
    - ufw
    - java
    - postgresql
    - nginx
    - tomcat
    - solr
    - certbot

  post_tasks:
    - name: Verify Java installation
      ansible.builtin.command: java -version
      register: java_check
      changed_when: false

    - name: Verify PostgreSQL is running
      ansible.builtin.systemd:
        name: postgresql
        state: started
      register: pg_status

    - name: Verify Solr is accessible
      ansible.builtin.uri:
        url: "http://localhost:{{ solr_port }}/solr/#/admin/ping"
        method: GET
        status_code: 200
      register: solr_check

    - name: Verify Tomcat is running
      ansible.builtin.wait_for:
        port: "{{ tomcat_port }}"
        delay: 5
        timeout: 30
      register: tomcat_check

    - name: Verify Nginx is running
      ansible.builtin.systemd:
        name: nginx
        state: started
      register: nginx_status

    - name: Display installation summary
      ansible.builtin.debug:
        msg:
          - "Prerequisites installed successfully!"
          - "Java: Installed"
          - "PostgreSQL: {{ 'Running' if pg_status.state == 'started' else 'Not Running' }}"
          - "Nginx: {{ 'Running' if nginx_status.state == 'started' else 'Not Running' }}"
          - "Solr: {{ 'Accessible' if solr_check.status == 200 else 'Not Accessible' }}"
          - "Tomcat: {{ 'Running' if tomcat_check.state == 'started' else 'Not Running' }}"
          - "SSL: {{ 'Enabled' if ssl_enabled else 'Disabled (set ssl_enabled=true and configure domain_name)' }}"
