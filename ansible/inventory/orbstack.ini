# OrbStack Machine Inventory
# This inventory file is used when PROVIDER=orbstack
#
# Connection uses OrbStack's auto-generated 'orb' SSH host
# (~/.orbstack/ssh/config, included from ~/.ssh/config).
#
# OrbStack's SSH username syntax:
#   <machine>@orb          -> connect to <machine> as the default user
#   <user>@<machine>@orb   -> connect to <machine> as <user>
#
# Therefore ansible_user below is the MACHINE NAME (not a Linux user):
# it selects the machine and logs in as the default user, which OrbStack
# creates with passwordless sudo. Roles' `become: true` escalates to root.
# OrbStack manages the SSH keys, so no key copying is required.

[dspace_servers]
dspace-server ansible_host=orb ansible_user=dspace-server ansible_python_interpreter=/usr/bin/python3
