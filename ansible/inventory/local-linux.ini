# Local Linux (loopback) Inventory
# This inventory file is used when PROVIDER=local-linux
#
# It installs DSpace onto the machine running `make`, using Ansible's
# local connection (no SSH, no VM). Debian/Ubuntu Linux hosts only.
#
# The current user must have passwordless sudo (the installer runs many
# privileged tasks unattended). See providers/local-linux.mk.

[dspace_servers]
dspace-server ansible_connection=local ansible_python_interpreter=/usr/bin/python3
