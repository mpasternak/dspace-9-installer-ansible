[defaults]
host_key_checking = False
# Inventory is now specified dynamically via -i flag from Makefile
# based on selected provider (tart, vagrant, or ssh)
remote_user = admin
interpreter_python = auto_silent
# stdout_callback = yaml  # Disabled due to Python 3.13 compatibility issue
pipelining = True
allow_world_readable_tmpfiles = True
# Custom callback: on a failed run, print a friendly hint on how to resume
# from the failed task (see callback_plugins/resume_hint.py)
callback_plugins = ./callback_plugins
callbacks_enabled = resume_hint


[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no